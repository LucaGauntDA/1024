<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  <rect x="76" y="76" width="360" height="360" rx="80" fill="#0d101a" stroke="url(#neon)" stroke-width="8" filter="url(#glow)"/>
  <text x="256" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="128" font-weight="900" fill="#22d3ee" text-anchor="middle" letter-spacing="-4">2048</text>
  <circle cx="256" cy="360" r="12" fill="#facc15" filter="url(#glow)"/>
</svg>
